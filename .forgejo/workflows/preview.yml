name: Deploy to Preview

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Checkout images
      uses: actions/checkout@v4
      with:
        repository: 'anas/PKCalc-img'
        path: 'img/'
        sparse-checkout: .
        ref: 'main'
    - name: Build
      run: |
        npm install
        node build
    - name: Deploy build
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN_PKCALC }}
      run: npx -y wrangler pages deploy dist --project-name=pk-calc --branch=preview
